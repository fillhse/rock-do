<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rocky — барьер на родной прокрутке</title>
<style>
/* Песочница. Подсказка над «Моими делами» за упругим барьером, сделанным из обычной прокрутки браузера:
   над списком — невидимый запас прокрутки длиной B. Пока его прокручиваешь, список с подсказкой едет
   вниз не вместе с прокруткой, а по кривой сопротивления (resist): у края легко, у пика почти стоит,
   за пиком легко. Инерция, остановка и «отпустил» — родные браузерные; куда довести после отпускания
   (открыть или спрятать) — решает родная привязка прокрутки (scroll-snap). Своих расчётов жеста нет.
   Дела листаются в своей прокрутке (#list-sc) внутри общей: браузер «прилипает» жестом к той прокрутке,
   где жест начался, — поэтому разгон снизу останавливается на «Моих делах», а новый жест, начатый уже
   в самом верху дел, переходит в общую прокрутку и упирается в барьер. */
:root{
  --bg1:#030912; --bg2:#07131c; --card:rgba(255,255,255,.05);
  --accent2:#6f38ff; --orange:#ffa42e; --text:#eef0f6; --muted:#8b93a7; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg1);color:var(--text);font-size:14px;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
.bar{flex:none;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07);background:#050c18;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--text);border-radius:999px;
  padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent2);border-color:var(--accent2)}
.info{color:var(--muted);font-size:11px;width:100%;margin-top:4px}

/* прокрутка — во всю ширину окна, содержимое колонкой по центру */
#sc{flex:1;overflow-y:auto;overscroll-behavior:none;scroll-snap-type:y mandatory;position:relative;
  --side:max(16px, calc((100% - 448px) / 2));background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#gap{height:var(--B)}                     /* запас прокрутки = барьер */
/* точка «подсказка открыта» — отдельная метка нулевой высоты: запас выше экрана был бы «большой» точкой
   привязки, внутри которой браузер разрешает останавливаться где угодно, и подсказка зависала бы посередине */
#top-snap{height:0;scroll-snap-align:start}
/* точка привязки (#main) не двигается: браузер считает точки привязки по сдвинутым (transform) рамкам,
   и сдвиг двигал бы саму точку — привязка дёргалась. Двигается вложенный #move */
#main{height:100%;scroll-snap-align:start;scroll-snap-stop:always}
#move{position:relative;height:100%;will-change:transform}
#list-sc{height:100%;overflow-y:auto;padding:18px var(--side) 120px}  /* дела — своя прокрутка */
#hero{position:absolute;left:var(--side);right:var(--side);bottom:100%;height:var(--H);padding-top:18px}
.hero{display:flex;gap:16px;align-items:center;height:142px;padding:14px 18px;border-radius:18px;
  border:1px solid rgba(255,255,255,.06);
  background:radial-gradient(circle at 24% 62%, rgba(111,56,255,.16), transparent 62%),linear-gradient(135deg,#0c1224 0%,#170f38 100%)}
.hero img{width:114px;height:auto;flex:none;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))}
.hero .phrase{font-size:18px;font-weight:700;line-height:1.3}
.hero .hint{color:var(--accent2);font-size:12px;line-height:1.4;margin-top:8px}
.sub{color:var(--muted);font-size:12px;margin-bottom:10px;cursor:pointer}
.sub b{color:var(--text)}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.checkbox{width:22px;height:22px;flex:none;border:2px solid var(--accent2);border-radius:50%}
.card b{font-weight:500;flex:1}
</style>
<style id="anim"></style>
</head>
<body>
  <div class="bar">
    <span style="color:var(--muted);font-size:12px">Барьер:</span>
    <button class="chip" data-b="1.2">чуть мягче</button>
    <button class="chip" data-b="1.4">тугой</button>
    <button class="chip" data-b="1.7">ещё туже</button>
    <div class="info" id="info"></div>
  </div>
  <div id="sc">
    <div id="top-snap"></div><div id="gap"></div>
    <div id="main"><div id="move">
      <div id="hero"><div class="hero">
        <img src="../img/rock-neutral.webp" alt="Рокки" width="360" height="322">
        <div><div class="phrase">Маленький шаг сегодня — большая гора завтра.</div>
          <div class="hint">Новые советы + Напоминания в Telegram</div></div>
      </div></div>
      <div id="list-sc"><div class="sub" id="head">Мои дела <b>14</b></div>
      <div id="list"></div></div>
    </div></div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const sc = $('sc'), main = $('move'), hero = $('hero');
$('list').innerHTML = ['Позвонить маме', 'Учить английский 15 мин', 'Прочитать 20 страниц', 'Тренировка', 'Купить продукты',
  'Написать отчёт', 'Полить цветы', 'Записаться к врачу', 'Оплатить интернет', 'Разобрать почту', 'Прогулка 30 минут',
  'Позвонить другу', 'Купить подарок', 'Почитать перед сном'].map((t) => `<div class="card"><div class="checkbox"></div><b>${t}</b></div>`).join('');

/* Кривая с рисунка: сила (сопротивление) по пути s от 0 (подсказка спрятана) до 1 (открыта):
   у края мала, к середине — пик, дальше спадает. Пик ровно посередине пути: отпустил до него —
   привязка вернёт к «Моим делам», после — откроет подсказку. */
const resist = (s) => { const x = (s - 0.5) / 0.22; return 1 + 7 * Math.exp(-x * x); }; // пик пониже и пошире — без рывка
// сколько подсказки видно (0…1) на пути s: подсказка выезжает тем медленнее, чем выше сила
const N = 200, cum = [0];
for (let i = 1; i <= N; i++) cum.push(cum[i - 1] + 1 / resist((i - 0.5) / N));
const reveal = (s) => { const k = Math.min(1, Math.max(0, s)) * N, i = Math.min(N - 1, Math.floor(k)); return (cum[i] + (cum[i + 1] - cum[i]) * (k - i)) / cum[N]; };

let B = 0, H = 160, share = 1;
// прокрутка t от 0 (самый верх — подсказка открыта) до B («Мои дела» вверху). Без сдвига список уехал бы
// вниз на B − t, а надо — на reveal·H: разницу гасим сдвигом. За пределами запаса сдвиг 0.
const shiftAt = (t) => { const s = 1 - t / B; return H * reveal(s) - B * s; };
function build() {
  B = Math.round(sc.clientHeight * share);
  sc.style.setProperty('--B', B + 'px'); sc.style.setProperty('--H', H + 'px');
  if (CSS.supports('animation-timeline: scroll()')) {
    // родная анимация от прокрутки: считает браузер, кадр в кадр с прокруткой
    const steps = Array.from({ length: 121 }, (_, i) => {
      const t = B * i / 120;
      return `${(i / 120 * 100).toFixed(2)}%{transform:translateY(${shiftAt(t).toFixed(2)}px)}`;
    }).join('');
    const fade = Array.from({ length: 121 }, (_, i) => {
      const t = B * i / 120, p = Math.min(1, reveal(1 - t / B) * 1.6);
      return `${(i / 120 * 100).toFixed(2)}%{opacity:${p.toFixed(3)};transform:scale(${(0.92 + 0.08 * p).toFixed(3)})}`;
    }).join('');
    $('anim').textContent = `@keyframes shift{${steps}} @keyframes fade{${fade}}
      #sc{scroll-timeline:--sc block}
      #move{animation:shift linear both;animation-timeline:--sc;animation-range:0px ${B}px}
      #hero .hero{transform-origin:50% 100%;animation:fade linear both;animation-timeline:--sc;animation-range:0px ${B}px}`;
    $('info').textContent = 'Сдвиг считает браузер (scroll-driven animations). B = ' + B + ' px — ' + share + ' высоты экрана.';
  } else {
    $('anim').textContent = '';
    sc.onscroll = () => apply();
    apply();
    $('info').textContent = 'Этот браузер не умеет анимацию от прокрутки — сдвиг считается скриптом по событию прокрутки. B = ' + B + ' px.';
  }
  sc.scrollTop = B; // начинаем с «Моих дел»
}
function apply() {
  const t = sc.scrollTop;
  main.style.transform = t < B ? `translateY(${shiftAt(t)}px)` : '';
  const p = Math.min(1, reveal(1 - Math.min(t, B) / B) * 1.6);
  hero.firstElementChild.style.opacity = p;
}
document.querySelectorAll('.chip').forEach((c) => c.onclick = () => {
  share = +c.dataset.b;
  document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c));
  build();
});
// нажатие на «Мои дела» — открыть или спрятать (родная плавная прокрутка)
$('head').onclick = () => sc.scrollTo({ top: sc.scrollTop < B / 2 ? B : 0, behavior: 'smooth' });

addEventListener('resize', build);
document.querySelector('.chip[data-b="1.4"]').click();
</script>
</body>
</html>
